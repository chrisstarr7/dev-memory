name: Vector integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-runtime:
    name: managed Python (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      DEV_MEMORY_HOME: ${{ runner.temp }}/dev-memory-managed
      DEV_MEMORY_VECTOR_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No system Python, isolated installation, offline recall and real vectors
        run: node tests/managed_python_smoke.cjs
  vectors:
    name: vectors (${{ matrix.runner.os }}, ${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - os: windows-latest
            arch: AMD64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.runner.os }}
    env:
      PYTHONUTF8: '1'
      DEV_MEMORY_VECTOR_INTEGRATION: '1'
      EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify native Python architecture
        run: python -c "import os, platform; from pathlib import Path; assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine(); assert Path('tests/test_vector_integration.py').is_file()"
      - name: Real local model and sqlite-vec integration
        env:
          DEV_MEMORY_VECTOR_ROOT: ${{ runner.temp }}/dev-memory-vector
        run: python -m unittest discover -s tests -p test_vector_integration.py -v
      - name: Storage lifecycle and bounded worker checks
        env:
          DEV_MEMORY_VECTOR_ROOT: ${{ runner.temp }}/dev-memory-vector
        run: |
          python -c "import json,os,subprocess,sys; from pathlib import Path; c=json.loads((Path(os.environ['DEV_MEMORY_VECTOR_ROOT'])/'vector-runtime/config.json').read_text()); sys.exit(subprocess.call([c['python'],'-m','unittest','discover','-s','tests','-p','test_vectors.py','-v']))"
